name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository, so the token it receives can do nothing else.
permissions:
  contents: read

jobs:
  core:
    name: Booking engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs here.
      # Dependabot keeps these up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      # Built without Node's type definitions: the engine must run in browsers and Workers too.
      - run: npm run build
