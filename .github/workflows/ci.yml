name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository, so the token it receives can do nothing else.
permissions:
  contents: read

jobs:
  core:
    name: Booking engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs here.
      # Dependabot keeps these up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Any advisory on what ships stops the build: the production dependencies stay at zero.
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      # Built without Node's type definitions: the engine must run in browsers and Workers too.
      - run: npm run build

  worker:
    name: Worker and Durable Object
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      # Inside workerd, the Workers runtime, with a real Durable Object and the network cut off.
      - run: npm test

  web:
    name: Demo and dashboard
    runs-on: ubuntu-latest
    # Installing Chromium's system libraries alone has taken 14 minutes when the runner's Ubuntu mirror is slow.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Pinned, because plain 22 takes the runner's cached copy, which can be older than Astro asks for:
          # Astro 7.4 refuses anything before 22.23.4.
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm test
      # Cloudflare's Turnstile test key, public and always passing: the build has its live demo, which the
      # page tests drive against the demo API's contract, without a model or a network.
      - run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # The version pinned in package-lock.json, and only the headless Chromium the pages are tested on.
      - run: npx playwright install --with-deps --only-shell chromium
      # Every page in both layouts, with axe, against the build above.
      - run: npm run test:pages
