name: Voice

on:
  push:
    branches: [main]
    paths: ['voice/**', '.github/workflows/voice.yml']
  pull_request:
    paths: ['voice/**', '.github/workflows/voice.yml']

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: voice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run --with pip-audit pip-audit --progress-spinner off --skip-editable
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
