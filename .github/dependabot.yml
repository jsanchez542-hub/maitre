version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The types must match the Node version the project runs on (22), not a newer one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Wrangler, workerd and the test plugin are released together and only work together,
      # and the plugin runs inside Vitest: a Vitest release can need the plugin's next one.
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*", "vitest"]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check supports TypeScript 5 and 6, not 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types must match the Node version the project runs on (22), not a newer one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @astrojs/preact supports Preact 10, not 11.
      - dependency-name: preact
        update-types: ["version-update:semver-major"]
    groups:
      # axe drives the same playwright-core as the test runner: two versions and their types no longer match.
      playwright:
        patterns: ["@playwright/test", "playwright-core"]
      astro:
        patterns: ["astro", "@astrojs/*"]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /voice
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The agents framework and its plugins are released together and only work together.
      livekit:
        patterns: ["livekit*"]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /voice
    schedule:
      interval: weekly
    ignore:
      # A new Python for the voice agent is an upgrade made on purpose and tried on a call, not a weekly bump.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
