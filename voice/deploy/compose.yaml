# The voice agent on a server it shares with other services. It opens no port: it reaches LiveKit, the speech
# providers and the Worker, and nothing reaches it. Run from the folder that holds .env (see voice/README.md).
name: maitre-voice

services:
  agent:
    image: maitre-voice:${MAITRE_VOICE_VERSION:?set MAITRE_VOICE_VERSION to the commit the image was built from}
    env_file: .env
    restart: unless-stopped
    # Its share of the server: past it the agent restarts, and the services beside it never feel it.
    mem_limit: 1200m
    memswap_limit: 1600m
    cpus: 1.5
    read_only: true
    tmpfs:
      - /tmp
      - /app/KMS
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
